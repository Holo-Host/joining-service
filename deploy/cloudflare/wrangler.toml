name = "joining-service"
main = "worker-entry.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "__SESSIONS_KV_NAMESPACE_ID__"
preview_id = "__SESSIONS_KV_PREVIEW_NAMESPACE_ID__"

# Routes: Worker handles /v1/* and /.well-known/* on your domain.
# Static UI assets are served by Cloudflare Pages on the same domain.
#
# If deploying alongside Cloudflare Pages on a custom domain, add route
# patterns so only API paths hit the Worker:
#
# [[routes]]
# pattern = "example.com/v1/*"
# zone_name = "example.com"
#
# [[routes]]
# pattern = "example.com/.well-known/holo-joining"
# zone_name = "example.com"
#
# If deploying the Worker standalone (workers.dev or sole custom domain),
# no routes section is needed -- all traffic goes to the Worker.
#
# To deploy from a pre-built release artefact (recommended):
#   1. Download worker.js and wrangler.toml from a tagged GitHub release
#   2. Substitute KV namespace IDs:
#      sed -i 's/__SESSIONS_KV_NAMESPACE_ID__/<id>/g' wrangler.toml
#      sed -i 's/__SESSIONS_KV_PREVIEW_NAMESPACE_ID__/<preview-id>/g' wrangler.toml
#   3. Set secrets:
#      npx wrangler secret put CONFIG_JSON
#      npx wrangler secret put SIGNING_KEY_HEX  (if membrane_proof.enabled)
#   4. Deploy the pre-built bundle:
#      npx wrangler deploy --no-bundle worker.js -c wrangler.toml
#
# To deploy from source:
#   1. Create the KV namespaces and fill in the IDs above
#   2. Set secrets (see above)
#   3. Deploy:
#      npx wrangler deploy -c deploy/cloudflare/wrangler.toml

[vars]
# Non-secret config can go here. For full config, use CONFIG_JSON secret.
# CONFIG_JSON = '{"happ":{"id":"my-app","name":"My App"},...}'
