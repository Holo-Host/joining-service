name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build Cloudflare Worker bundle
        run: |
          npx wrangler deploy --dry-run \
            --config deploy/cloudflare/wrangler.toml \
            --outdir "$PWD/dist/worker"
          cp dist/worker/worker-entry.js dist/worker.js
          cd dist && sha256sum worker.js > worker.js.sha256
      - name: Upload release artefacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/worker.js
            dist/worker.js.sha256
            deploy/cloudflare/wrangler.toml
